name: Build snes9x2002 (Android armeabi-v7a, Xperia Play)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r23c
  # NDK r23c's minimum API is 16 (Android 4.1). API 15 (4.0.4) needs NDK r17 or older.
  ANDROID_API: 16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up NDK r23c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          add-to-path: false
          link-to-sdk: false

      - name: Apply source fixes
        run: |
          # sa1.c: range check was always false (&& instead of ||)
          sed -i 's/(address < 0x2300) && (address > 0x230d)/(address < 0x2300) || (address > 0x230d)/' src/sa1.c
          grep -q '(address < 0x2300) || (address > 0x230d)' src/sa1.c

          # spc700.c: %lX used with an int argument
          sed -i 's/at %04lX/at %04X/' src/spc700.c
          grep -q 'at %04X' src/spc700.c
          ! grep -q 'at %04lX' src/spc700.c

      - name: Enable ARM assembly in jni/Android.mk
        run: |
          # Turn on the ARM code paths and the two asm modules (SPC700 and 65C816 CPU core).
          sed -i \
            -e 's/^ARM_ASM        := 0$/ARM_ASM        := 1\nASM_SPC700     := 1\nASM_CPU        := 1/' \
            -e 's/^LOCAL_SRC_FILES := \$(SOURCES)$/LOCAL_SRC_FILES := $(SOURCES) $(SOURCES_ASM)/' \
            jni/Android.mk
          # Fail loudly if upstream changed the lines we patch.
          grep -q '^ARM_ASM        := 1$' jni/Android.mk
          grep -q '^ASM_SPC700     := 1$' jni/Android.mk
          grep -q '^ASM_CPU        := 1$' jni/Android.mk
          grep -q 'LOCAL_SRC_FILES := $(SOURCES) $(SOURCES_ASM)' jni/Android.mk

      - name: Build (ndk-build, per official jni/Android.mk)
        working-directory: jni
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # Xperia Play = Snapdragon S2 (Scorpion, Cortex-A8 class): ARMv7-A, VFPv3, NEON, softfp ABI.
          # LOCAL_ARM_MODE := arm already forces ARM (non-Thumb) code, so no -marm needed.
          # Strict aliasing is left at the default (on), which matches upstream's ARM build path.
          OPT_FLAGS="-O3 -ffast-math -fomit-frame-pointer \
            -fno-stack-protector -U_FORTIFY_SOURCE \
            -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -fno-plt -fmerge-all-constants -fno-semantic-interposition \
            -mcpu=cortex-a8 -mtune=cortex-a8 -mfpu=neon -mfloat-abi=softfp \
            -funroll-loops -DNDEBUG -flto"

          # LTO codegen happens at link time, so the optimization level and CPU
          # target must be passed to the linker too. r23c already adds
          # --no-rosegment and -ffunction-sections/-fdata-sections.
          LD_FLAGS="-Wl,--hash-style=both -Wl,-O2 -Wl,--gc-sections \
            -O3 -mcpu=cortex-a8 -mfpu=neon -mfloat-abi=softfp \
            -flto -Wl,--icf=all"

          "$NDK_HOME/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk \
            APP_ABI=armeabi-v7a \
            APP_PLATFORM=android-${ANDROID_API} \
            APP_STL=none \
            APP_OPTIM=release \
            APP_CFLAGS="$OPT_FLAGS" \
            APP_LDFLAGS="$LD_FLAGS" \
            V=1

      - name: Rename and inspect output
        run: |
          mkdir -p dist
          OUT=dist/snes9x2002_libretro_android_lto_asm.so
          cp jni/libs/armeabi-v7a/libretro.so "$OUT"
          file "$OUT"
          ls -l "$OUT"
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -A "$OUT" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: snes9x2002_libretro_android-armeabi-v7a-lto-asm
          path: dist/snes9x2002_libretro_android_lto_asm.so
